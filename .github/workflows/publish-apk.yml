name: Publish APK to Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl -L -o Speakeo.apk "https://release-assets.githubusercontent.com/github-production-release-asset/1335343751/b56166a0-1492-4686-86e4-c61e9170bdac?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-11-22T17%3A55%3A22Z&rscd=attachment%3B+filename%3Dapp-release.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-11-22T16%3A55%3A09Z&ske=2026-11-22T17%3A55%3A22Z&sks=b&skv=2018-11-09&sig=cd0sCj4MDNdRsIrqE1obJbxXB7QTTa8J6GbYBt9vbQU%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5NTM2ODMwOSwibmJmIjoxNzk1MzY2NTA5LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.B4G-IQ8G5DZO5gyUEspC5ieqiqU2tbQ7Fq5j7-88WsA&response-content-disposition=attachment%3B%20filename%3Dapp-release.apk&response-content-type=application%2Fvnd.android.package-archive"
      
      - name: Verify APK exists
        run: ls -lh Speakeo.apk

      - name: Generate Tag Name
        id: tag_generator
        run: echo "TAG_NAME=release-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Speakeo Release ${{ env.TAG_NAME }}"
          files: Speakeo.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}